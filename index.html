<style>
:root{--red:#8E1B2B;--red2:#B8324A;--gold:#C9966B;--gold2:#E8C4A0;--cream:#FBF4EA;--ink:#4A2028;--muted:#8C6A66;--serif:"Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong",serif;--sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

<script>
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}

/* ===== INPUT ===== */
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ZHI_T=['23-01','01-03','03-05','05-07','07-09','09-11','11-13','13-15','15-17','17-19','19-21','21-23'];
const inp={sex:'f',like:'auto',hour:-1,nick:''};
(function(){const y=$('yy'),m=$('mm'),d=$('dd');for(let i=2010;i>=1960;i--)y.add(new Option(i+'年',i));y.value=1998;
 for(let i=1;i<=12;i++)m.add(new Option(i+'月',i));const fd=()=>{const n=new Date(+y.value,+m.value,0).getDate(),k=d.value||1;d.innerHTML='';for(let i=1;i<=n;i++)d.add(new Option(i+'日',i));d.value=Math.min(k,n)};y.onchange=m.onchange=fd;fd();
 const g=$('hourGrid');ZHI.forEach((z,i)=>{const b=document.createElement('button');b.innerHTML=z+'时<small>'+ZHI_T[i]+'</small>';b.dataset.v=i;g.appendChild(b)});
 const b=document.createElement('button');b.innerHTML='不确定<small>按三柱</small>';b.dataset.v=-1;b.className='on';g.appendChild(b);
 g.onclick=e=>{const t=e.target.closest('button');if(!t)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));t.classList.add('on');inp.hour=+t.dataset.v};
 [['sexSeg','sex'],['likeSeg','like']].forEach(([id,k])=>$(id).onclick=e=>{const t=e.target.closest('button');if(!t)return;$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));t.classList.add('on');inp[k]=t.dataset.v});
})();

/* ===== QUESTIONS ===== dims: w温柔 s稳重 f自由 r浪漫 z智慧 h热烈 */
const QS=[
['周末理想的约会是？',[['窝在家里一起做饭看电影','w'],['说走就走的短途旅行','f'],['看展、逛书店、聊到深夜','z'],['去游乐园尖叫一整天','h']]],
['你最容易被哪种瞬间打动？',[['他记得你随口说过的小事','w'],['他认真工作时的侧脸','s'],['他为你准备的小惊喜','r'],['他讲一个很有见地的观点','z']]],
['吵架之后你希望对方？',[['先抱抱我，道理以后再讲','w'],['冷静下来认真沟通','s'],['用一个玩笑把我逗笑','h'],['给我一点空间，自己消化','f']]],
['你心里的「安全感」更像？',[['秒回消息，随时找得到','w'],['有规划，未来清清楚楚','s'],['彼此独立，又互相欣赏','f'],['无论多忙都会说爱你','r']]],
['朋友眼中的你是？',[['温柔细腻的倾听者','w'],['想法很多的小疯子','h'],['靠谱的小大人','s'],['有点神秘的文艺派','r']]],
['你更想收到哪种礼物？',[['一封手写的长信','r'],['我念叨很久的实用好物','s'],['一张去远方的机票','f'],['一本他觉得我会喜欢的书','z']]],
['如果恋爱是一种天气，你希望是？',[['春日微风，温温柔柔','w'],['夏日骤雨，轰轰烈烈','h'],['秋日晴空，清清朗朗','z'],['冬夜初雪，安安静静','s']]],
['你对「见家长」的态度？',[['顺其自然，水到渠成','w'],['认定了就早点定下来','s'],['不急，先好好享受恋爱','f'],['想要一个有仪式感的开始','r']]],
['你最受不了另一半？',[['忽冷忽热、没有回应','w'],['没有上进心','s'],['控制欲太强','f'],['说话没趣、聊不到一起','z']]],
['用一个词形容你理想的爱情？',[['细水长流','s'],['势均力敌','z'],['怦然心动','h'],['浪漫至死','r']]]];
let ans=[],qi=0;
function renderQ(){const q=QS[qi];$('qn').textContent=(qi+1)+' / '+QS.length;$('qp').style.width=(qi/QS.length*100)+'%';$('qback').style.visibility=qi?'visible':'hidden';
 $('qt').textContent=q[0];$('qo').innerHTML='';q[1].forEach((o,k)=>{const b=document.createElement('button');b.className='opt'+(ans[qi]===k?' on':'');b.textContent=['A','B','C','D'][k]+'. '+o[0];b.onclick=()=>{ans[qi]=k;b.classList.add('on');setTimeout(()=>{if(qi<QS.length-1){qi++;renderQ()}else finish()},180)};$('qo').appendChild(b)})}

/* ===== BAZI ===== */
const GAN_EL={甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
const ZHI_EL={子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
const ELS=['木','火','土','金','水'];const EC={木:'#3F8F5A',火:'#C8323C',土:'#A9773A',金:'#B08A2E',水:'#2E6A9E'};
const GEN={木:'火',火:'土',土:'金',金:'水',水:'木'};const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const genBy=e=>ELS.find(x=>GEN[x]===e);
function calcBazi(y,m,d,h){
 const hr=h<0?12:(h===0?0:h*2);const ec=Solar.fromYmdHms(y,m,d,hr,30,0).getLunar().getEightChar();
 const P=[ec.getYear(),ec.getMonth(),ec.getDay()];if(h>=0)P.push(ec.getTime());
 const cnt={木:0,火:0,土:0,金:0,水:0};P.forEach(p=>{cnt[GAN_EL[p[0]]]++;cnt[ZHI_EL[p[1]]]++});
 const dm=GAN_EL[P[2][0]],total=P.length*2,str=cnt[dm]+cnt[genBy(dm)];const strong=str>=total/2;
 let xi=strong?[KE[dm],GEN[dm]]:[genBy(dm),dm];
 const missing=ELS.filter(e=>!cnt[e]);
 return {P,cnt,dm,dmGan:P[2][0],strong,xi,missing,total,lunar:Solar.fromYmd(y,m,d).getLunar()};
}

/* ===== ARCHETYPES ===== */

const FONT='"Noto Serif SC","Noto Serif CJK SC","Songti SC","PingFang SC","Noto Sans CJK SC",serif';
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapT(c,t,mw){const o=[];let l='';for(const ch of t){if(c.measureText(l+ch).width>mw&&l){o.push(l);l=ch}else l+=ch}if(l)o.push(l);return o}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function buildShare(){const {bz,a,pg,tl,q,match}=R;const W=1080,P=72,CW=W-P*2;
 const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portrait(a,pg)));
 const cv=document.createElement('canvas'),x=cv.getContext('2d');
 function draw(d){const T=(t,tx,ty,s,col,wt,al)=>{x.font=`${wt||400} ${s}px ${FONT}`;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='top';if(d)x.fillText(t,tx,ty)};
  const box=(y,h)=>{if(d){x.fillStyle='#FFFBF5';rr(x,P,y,CW,h,32);x.fill();x.strokeStyle='#EBD3BC';x.lineWidth=2;x.stroke()}};
  if(d){const g=x.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#F6DCD0');g.addColorStop(.3,'#FBF4EA');g.addColorStop(1,'#F3E2D2');x.fillStyle=g;x.fillRect(0,0,W,cv.height);x.strokeStyle='#C9966B';x.lineWidth=3;rr(x,24,24,W-48,cv.height-48,36);x.stroke()}
  let y=90;T('— 月老红线 · 姻缘簿 —',W/2,y,32,'#C9966B',400,'center');y+=64;T((inp.nick||'我')+'的未来伴侣',W/2,y,64,'#8E1B2B',700,'center');y+=110;
  box(y,260);['年柱','月柱','日柱','时柱'].forEach((h,i)=>{const cx=P+CW/8*(2*i+1),p=bz.P[i];T(h,cx,y+30,28,'#8C6A66',400,'center');
   if(p){T(p[0],cx,y+80,64,EC[GAN_EL[p[0]]],700,'center');T(p[1],cx,y+160,64,EC[ZHI_EL[p[1]]],700,'center')}else T('？',cx,y+120,56,'#C9B5A8',700,'center')});y+=290;
  box(y,250);ELS.forEach((e,i)=>{const by=y+36+i*40,mx=Math.max(...Object.values(bz.cnt),1);T(e,P+48,by-4,30,EC[e],700);if(d){x.fillStyle='#F2E2D4';rr(x,P+100,by,CW-220,20,10);x.fill();x.fillStyle=EC[e];rr(x,P+100,by,Math.max(20,(CW-220)*bz.cnt[e]/mx),20,10);x.fill()}T(String(bz.cnt[e]),P+CW-60,by-4,30,'#8C6A66')});y+=280;
  box(y,560);if(d)x.drawImage(img,W/2-150,y+30,300,300);T(a.name,W/2,y+350,52,'#8E1B2B',700,'center');T((pg==='f'?a.f:a.m)+' · 契合度 '+match+'%',W/2,y+420,34,'#5E3A3E',400,'center');T(a.kw.join(' · '),W/2,y+480,32,'#B8324A',400,'center');y+=590;
  box(y,200);T('桃花旺年',P+48,y+36,38,'#8E1B2B',700);T(tl.top.map(t=>t.y+t.gz).join('  ·  '),P+48,y+96,36,'#5E3A3E');T('最佳季节：'+tl.season[0],P+48,y+146,32,'#8C6A66');y+=230;
  x.font=`500 40px ${FONT}`;const ql=wrapT(x,'「'+q+'」',CW-80);ql.forEach((l,i)=>T(l,W/2,y+i*60,40,'#8E1B2B',500,'center'));y+=ql.length*60+50;
  T('生辰八字测姻缘 · 你的未来伴侣',W/2,y,40,'#5A2A30',700,'center');y+=64;T(URL_,W/2,y,28,'#B8324A',400,'center');y+=50;T('仅供娱乐，不作为任何决策依据',W/2,y,26,'#8C6A66',400,'center');y+=90;return y}
 cv.width=W;cv.height=4000;const H=draw(false);cv.height=H;draw(true);return cv.toDataURL('image/png')}

const MANTLE_NS='catquiz-zph420-codes';

const COL='bz';
const ACCESS_KEY='bazilove_unlocked';
const isUnlocked=()=>{try{return sessionStorage.getItem(ACCESS_KEY)==='1'}catch(e){return false}};
const setUnlocked=c=>{try{sessionStorage.setItem(ACCESS_KEY,'1');sessionStorage.setItem('bazilove_code',c)}catch(e){}};
const normalizeCode=v=>String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
function openCodeModal(){$('codeMask').classList.add('show');setTimeout(()=>$('codeInput').focus(),50)}
function closeCodeModal(){$('codeMask').classList.remove('show')}
function startFlow(){closeCodeModal();ans=[];qi=0;show('input')}
async function mantleGet(code){const r=await fetch(`https://mantledb.sh/v2/${MANTLE_NS}/${COL}/${encodeURIComponent(code)}`,{headers:{'X-Mantle-Key':MANTLE_KEY}});if(r.status===404)return null;if(!r.ok)throw new Error('net '+r.status);return r.json()}
async function mantleInc(code,by){const r=await fetch(`https://mantledb.sh/v2/increment/${MANTLE_NS}/${COL}/${encodeURIComponent(code)}`,{method:'POST',headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},body:JSON.stringify({key:'remaining',by})});if(!r.ok)throw new Error('net '+r.status);return r.json()}
async function redeemCode(code){const data=await mantleGet(code);if(!data||typeof data.remaining!=='number')return {ok:false,reason:'invalid'};if(data.remaining<=0)return {ok:false,reason:'exhausted'};
 const after=await mantleInc(code,-1);const left=typeof after.remaining==='number'?after.remaining:-1;if(left<0){try{await mantleInc(code,1)}catch(e){}return {ok:false,reason:'exhausted'}}return {ok:true,remaining:left}}
async function tryUnlock(fromUrl){const code=normalizeCode($('codeInput').value);if(!code){if(!fromUrl)toast('请输入测算码');return}
 const btn=$('btnCodeOk');btn.disabled=true;btn.textContent='验证中…';
 try{const res=await redeemCode(code);if(res.ok){setUnlocked(code);toast(res.remaining>0?'验证成功，还可以测 '+res.remaining+' 次':'验证成功，这是本码最后一次');startFlow();return}
  if(!fromUrl)toast(res.reason==='exhausted'?'此测算码已用完（每个码限 3 次）':'测算码不正确')}
 catch(e){console.error(e);if(!fromUrl)toast('网络异常，请稍后重试')}finally{btn.disabled=false;btn.textContent='开始测算'}}
